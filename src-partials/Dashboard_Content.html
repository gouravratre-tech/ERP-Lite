<!-- Main Content Area -->
<div class="container-inner">
  <header class="workspace-topbar">
    <div class="page-identity">
      <p class="eyebrow" id="page-breadcrumb">Workspace / Overview</p>
      <div class="page-title-row">
        <h2 class="app-title" id="app-heading">Dashboard</h2>
        <select id="firm-selector" class="firm-selector" style="display:none;" onchange="switchFirm(this.value)"></select>
      </div>
    </div>
    <div class="top-actions" aria-label="Workspace actions">
      <button class="btn secondary utility-action" onclick="runSetup()" title="Create any missing sheets / columns">Initialize</button>
      <button class="btn secondary utility-action" onclick="runDiagnostics()">Diagnostics</button>
      <button class="btn secondary utility-action" onclick="openBulkUpload()" title="Upload one Excel/CSV for any or all segments">Bulk upload</button>
      <button class="btn secondary utility-action" onclick="openBankStatementUpload()">Bank statement</button>
      <button class="btn secondary utility-action" onclick="openPurchaseBillUpload()" title="Upload a supplier purchase bill PDF — auto-extract data">Purchase bill</button>
      <button class="btn secondary utility-action" onclick="openAttachmentsFolder()" title="Open the document folder">Files</button>
      <button class="btn refresh-action" onclick="loadData(true)" title="Force refresh — bypasses all caches, reads fresh from Google Sheets">↻ <span>Refresh</span></button>
    </div>
  </header>

  <!-- Status (global — visible on every page) -->
  <div id="status" class="status">Ready.</div>
  <div id="sheetLink" class="status"></div>
  <div id="diagnostics"></div>

  <!-- PAGE: Dashboard (own page — KPIs + charts only) -->
  <div id="page-dashboard">
    <section class="dashboard-welcome">
      <div>
        <p class="eyebrow">Business performance</p>
        <h1>Good to see you.</h1>
        <p class="dashboard-subtitle">A clear view of the work, cash flow, and items that need attention.</p>
      </div>
      <div class="quick-actions" aria-label="Quick actions">
        <button class="quick-action" onclick="switchTab('workOrders')"><span>+</span> New work order</button>
        <button class="quick-action" onclick="switchTab('bills')"><span>+</span> Create invoice</button>
      </div>
    </section>
    <div id="dashboard" class="grid"></div>
    <div id="charts" class="charts-grid"></div>
  </div>

  <!-- PAGE: Active section tab (its own separate page) -->
  <div id="tab-content"></div>
</div>
