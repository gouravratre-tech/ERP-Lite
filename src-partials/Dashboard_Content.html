<!-- Main Content Area -->
<div class="container-inner">
  <!-- Top Bar: page title + firm + grouped actions -->
  <div class="topbar">
    <div class="topbar-left">
      <h2 class="app-title" id="app-heading">Dashboard</h2>
      <select id="firm-selector" style="display:none;" onchange="switchFirm(this.value)" title="Switch company / firm"></select>
    </div>
    <div class="topbar-actions">
      <button class="btn" onclick="loadData(true)" title="Force refresh — reads fresh from the database">Refresh Data</button>

      <div class="menu-wrap">
        <button class="btn secondary" onclick="toggleMenu('menu-import')">Import &nbsp;&#9662;</button>
        <div class="menu" id="menu-import">
          <button onclick="closeMenus(); openBulkUpload();" title="Upload one Excel/CSV for any or all segments">Bulk Upload (All Segments)</button>
          <button onclick="closeMenus(); openBankStatementUpload();" title="Upload a bank statement and auto-reconcile receipts & payments">Bank Statement Upload</button>
          <button onclick="closeMenus(); openPurchaseBillUpload();" title="Upload a supplier purchase bill PDF — auto-extract data">Purchase Bill (PDF)</button>
        </div>
      </div>

      <div class="menu-wrap">
        <button class="btn secondary" onclick="toggleMenu('menu-system')">System &nbsp;&#9662;</button>
        <div class="menu" id="menu-system">
          <button onclick="closeMenus(); runSetup();" title="Create any missing tables / columns in the database">Initialize Database</button>
          <button onclick="closeMenus(); runDiagnostics();" title="Check every table, row count and amount column">Diagnostics</button>
          <button onclick="closeMenus(); openAttachmentsFolder();" title="Open the attachments area (Work Order / Purchase Order files)">Files &amp; Attachments</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Status (global — visible on every page) -->
  <div id="status" class="status">Ready.</div>
  <div id="sheetLink" class="status"></div>
  <div id="diagnostics"></div>

  <!-- PAGE: Dashboard (own page — pipeline + KPI groups + charts only) -->
  <div id="page-dashboard">
    <div id="dashboard"></div>
    <div id="charts" class="charts-grid"></div>
  </div>

  <!-- PAGE: Active section tab (its own separate page) -->
  <div id="tab-content"></div>
</div>
