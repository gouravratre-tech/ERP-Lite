    function setStatus(msg, isError) { const el = document.getElementById('status'); el.textContent = msg; el.style.color = isError ? '#e11d48' : '#64748b'; }
    function toast(msg, type) {
      const wrap = document.getElementById('toast-wrap'); const el = document.createElement('div');
      el.className = 'toast ' + (type || ''); el.textContent = msg; wrap.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
      setTimeout(() => el.remove(), 3000);
    }
    function showLoading(b) { document.getElementById('loading-overlay').classList.toggle('hidden', !b); }
    function money(v) { return Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 }); }
    function fmtDate(v) {
      if (!v) return '';
      const s = String(v);
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return m[3] + '/' + m[2] + '/' + m[1];
      const d = new Date(v);
      return isNaN(d) ? s : d.toLocaleDateString('en-IN');
    }
    function badge(value) {
      const cls = String(value || '').toLowerCase().replace(/[\s\/().-]+/g, '');
      return `<span class="badge ${cls}">${value || 'Pending'}</span>`;
    }
    function optionList(list, idKey, textKey) { return list.map(x => ({ value: x[idKey], label: `${x[textKey]} (${x[idKey]})` })); }
    function customerName(id) { const c = (state.data.customers || []).find(x => x.CustomerId === id); return c ? c.Name : (id || ''); }
    function supplierName(id) { const s = (state.data.suppliers || []).find(x => x.SupplierId === id); return s ? s.Name : (id || ''); }
    function customerById(id) { return (state.data.customers || []).find(x => x.CustomerId === id) || null; }
    function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    function attachmentLink(v) {
      return v ? `<a class="file-link" href="${escapeHtml(v)}" target="_blank" rel="noopener">📎 View File</a>` : '<span class="file-none">—</span>';
    }
    function remainingBadge(v) {
      return Number(v) > 0
        ? `<span class="badge unpaid" title="Remaining to settle">₹ ${money(v)}</span>`
        : '<span class="badge paid" title="Fully settled">Cleared ✔</span>';
    }
    // ============================================================
    // PAYMENT ALLOCATION — compute received/remaining per bill & PO
    // Receipts are allocated to a customer's bills oldest-first (FIFO);
    // payouts are allocated to a supplier's POs the same way.
    // ============================================================
    function computeAllocations() {
      const alloc = { customers: {}, suppliers: {} };
      // ---- CUSTOMER SIDE: bills vs payment-in (NOT RECEIVED) ----
      const received = {};
      (state.data.paymentsIn || []).forEach(p => { received[p.CustomerId] = (received[p.CustomerId] || 0) + (Number(p.Amount) || 0); });
      const usedPool = {};
      (state.data.bills || []).slice()
        .sort((a, b) => String(a.Date).localeCompare(String(b.Date)) || String(a.BillId).localeCompare(String(b.BillId)))
        .forEach(b => {
          const pool = Math.max(0, (received[b.CustomerId] || 0) - (usedPool[b.CustomerId] || 0));
          const total = Number(b.TotalAmount) || 0;
          const rec = Math.min(total, pool);
          b._received = +rec.toFixed(2);
          b._remaining = +(total - rec).toFixed(2);
          usedPool[b.CustomerId] = (usedPool[b.CustomerId] || 0) + rec;
          const a = alloc.customers[b.CustomerId] = alloc.customers[b.CustomerId] || { billed: 0, received: 0, remaining: 0 };
          a.billed += total; a.received += rec; a.remaining += (total - rec);
        });
      // ---- SUPPLIER SIDE: POs vs expense/payment-out (NOT GIVEN) ----
      const paid = {};
      (state.data.expensesOut || []).forEach(x => { paid[x.SupplierId] = (paid[x.SupplierId] || 0) + (Number(x.Amount) || 0); });
      const usedPayPool = {};
      (state.data.purchaseOrders || []).slice()
        .sort((a, b) => String(a.Date).localeCompare(String(b.Date)) || String(a.PurchaseOrderId).localeCompare(String(b.PurchaseOrderId)))
        .forEach(p => {
          const pool = Math.max(0, (paid[p.SupplierId] || 0) - (usedPayPool[p.SupplierId] || 0));
          const total = Number(p.Amount) || 0;
          const out = Math.min(total, pool);
          p._paid = +out.toFixed(2);
          p._remaining = +(total - out).toFixed(2);
          usedPayPool[p.SupplierId] = (usedPayPool[p.SupplierId] || 0) + out;
          const a = alloc.suppliers[p.SupplierId] = alloc.suppliers[p.SupplierId] || { ordered: 0, paid: 0, remaining: 0 };
          a.ordered += total; a.paid += out; a.remaining += (total - out);
        });
      state.alloc = alloc;
    }

        .sort((a, b) => b.remaining - a.remaining);

    function downloadCsv(filename, columns, rows) {
      const header = columns.map(c => c.label); const lines = [header.join(',')];
      rows.forEach(row => {
        const line = columns.map(c => {
          let v = row[c.key]; v = v == null ? '' : String(v);
          if (v.indexOf(',') > -1 || v.indexOf('"') > -1 || v.indexOf('\n') > -1) v = '"' + v.replace(/"/g, '""') + '"';
          return v;
        });
        lines.push(line.join(','));
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }

    // ============================================================
    // MODAL SYSTEM
    // ============================================================
    function closeModal() { document.getElementById('modal-root').innerHTML = ''; document.removeEventListener('keydown', onModalEsc); }
    function onModalEsc(e) { if (e.key === 'Escape') closeModal(); }

    function renderField(field, existing) {
      const val = existing ? (existing[field.key] != null ? existing[field.key] : '') : (field.default != null ? field.default : '');
      const cls = 'field ' + (field.cls || ''); const req = field.required ? 'required' : '';
      const hint = field.hint ? `<div class="hint">💡 ${field.hint}</div>` : '';
      if (field.type === 'lineitems') {
        return `<div class="${cls}"><label>${field.label}${field.required ? '*' : ''}</label>
          <div id="li-container"></div>
          <div class="li-toolbar"><button type="button" class="btn ghost small" onclick="liAddRow()">➕ Add Row</button>
          <span id="li-summary" class="li-summary"></span></div>${hint}</div>`;
      }
      if (field.type === 'itempicker') {
        const items = state.data.inventory || [];
        if (!items.length) return `<div class="${cls}"><label>${field.label}</label><div class="hint">No items yet — add them in the 🧰 Inventory tab, then pick them here to auto-fill.</div></div>`;
        const opts = ['<option value="">— Select an item to auto-fill —</option>'].concat(items.map(it =>
          `<option value="${escapeHtml(it.ItemId)}" data-name="${escapeHtml(it.ItemName)}" data-desc="${escapeHtml(it.Description || it.ItemName)}" data-rate="${it.Rate != null && it.Rate !== '' ? it.Rate : 0}" data-gst="${it.GSTPercent != null && it.GSTPercent !== '' ? it.GSTPercent : ''}">${escapeHtml(it.ItemName)} — ₹${money(it.Rate || 0)} / ${escapeHtml(it.Unit || 'Nos')}</option>`)).join('');
        return `<div class="${cls}"><label>${field.label}</label><select name="__itempicker" onchange="fillFromItem(this)">${opts}</select>${hint}</div>`;
      }
      if (field.type === 'file') {
        const current = existing && existing.AttachmentUrl
          ? `<div class="hint">Current: <a class="file-link" href="${escapeHtml(existing.AttachmentUrl)}" target="_blank" rel="noopener">📎 View saved file</a> — choose a new file to replace it</div>` : '';
        return `<div class="${cls}"><label>${field.label}</label><input name="__attachment" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.gif,.doc,.docx,.xls,.xlsx" />${current}${hint}</div>`;
      }
      if (field.type === 'select') {
        const opts = typeof field.options === 'function' ? field.options() : (field.options || []);
        const isRefList = opts.length && typeof opts[0] === 'object';
        const optionHtml = isRefList
          ? ['<option value="">Select</option>'].concat(opts.map(o => `<option value="${escapeHtml(o.value)}" ${String(val) === String(o.value) ? 'selected' : ''}>${escapeHtml(o.label)}</option>`)).join('')
          : opts.map(o => `<option value="${escapeHtml(o)}" ${String(val) === String(o) ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
        return `<div class="${cls}"><label>${field.label}${field.required ? '*' : ''}</label><select name="${field.name}" ${req}>${optionHtml}</select>${hint}</div>`;
      }
      if (field.type === 'textarea') return `<div class="${cls}"><label>${field.label}${field.required ? '*' : ''}</label><textarea name="${field.name}" ${req}>${escapeHtml(val)}</textarea>${hint}</div>`;
      const type = field.type || 'text'; const step = type === 'number' ? 'step="0.01"' : '';
      const ph = field.placeholder ? `placeholder="${escapeHtml(field.placeholder)}"` : '';
      return `<div class="${cls}"><label>${field.label}${field.required ? '*' : ''}</label><input name="${field.name}" type="${type}" ${step} ${ph} value="${escapeHtml(val)}" ${req} />${hint}</div>`;
    }

    // ============================================================
    // LINE ITEMS (Bill / Quotation rows — replaces the old single
    // paragraph "Description" box with proper itemized rows)
    // ============================================================
    let LI_STATE = { hasHsn: false, hasGst: false, rows: [] };
    function liEmptyRow() { return { description: '', hsn: '', qty: 1, unit: 'Nos', rate: '' }; }
    function liRowAmount(row) { return (parseFloat(row.qty) || 0) * (parseFloat(row.rate) || 0); }
    function liTotals() {
      const base = LI_STATE.rows.reduce((a, r) => a + liRowAmount(r), 0);
      let gstP = 0;
      if (LI_STATE.hasGst) { const el = document.querySelector('#entity-form [name="gstPercent"]'); gstP = el ? (parseFloat(el.value) || 0) : 0; }
      const gstAmt = LI_STATE.hasGst ? base * gstP / 100 : 0;
      return { base, gstP, gstAmt, total: base + gstAmt };
    }
    function liUpdateSummary() {
      const el = document.getElementById('li-summary'); if (!el) return;
      const t = liTotals();
      el.innerHTML = LI_STATE.hasGst
        ? `Sub Total: <b>₹${money(t.base)}</b> &nbsp;|&nbsp; GST (${t.gstP}%): <b>₹${money(t.gstAmt)}</b> &nbsp;|&nbsp; Total: <b>₹${money(t.total)}</b>`
        : `Sub Total: <b>₹${money(t.base)}</b> <span style="font-weight:400;">(GST extra as applicable)</span>`;
    }
    function renderLIRows() {
      const wrap = document.getElementById('li-container'); if (!wrap) return;
      const hsnTh = LI_STATE.hasHsn ? '<th style="width:90px;">HSN/SAC</th>' : '';
      const rowsHtml = LI_STATE.rows.map((r, i) => `<tr>
          <td class="c">${i + 1}</td>
          <td><textarea oninput="liUpdate(${i},'description',this.value)" placeholder="Particulars / description">${escapeHtml(r.description || '')}</textarea></td>
          ${LI_STATE.hasHsn ? `<td><input type="text" value="${escapeHtml(r.hsn || '')}" oninput="liUpdate(${i},'hsn',this.value)" /></td>` : ''}
          <td><input type="number" step="0.01" min="0" value="${r.qty != null ? r.qty : 1}" oninput="liUpdate(${i},'qty',this.value)" /></td>
          <td><input type="text" value="${escapeHtml(r.unit || 'Nos')}" oninput="liUpdate(${i},'unit',this.value)" /></td>
          <td><input type="number" step="0.01" min="0" value="${r.rate != null ? r.rate : ''}" oninput="liUpdate(${i},'rate',this.value)" /></td>
          <td class="li-amt r">₹${money(liRowAmount(r))}</td>
          <td class="c"><button type="button" class="btn danger small" title="Remove row" onclick="liRemoveRow(${i})" ${LI_STATE.rows.length <= 1 ? 'disabled' : ''}>✕</button></td>
        </tr>`).join('');
      wrap.innerHTML = `<table class="li-table"><thead><tr>
          <th style="width:28px;">#</th><th>Particulars</th>${hsnTh}<th style="width:64px;">Qty</th><th style="width:64px;">Unit</th><th style="width:100px;">Rate</th><th style="width:105px;">Amount</th><th style="width:32px;"></th>
        </tr></thead><tbody>${rowsHtml}</tbody></table>`;
      liUpdateSummary();
    }
    function liUpdate(idx, key, value) {
      if (!LI_STATE.rows[idx]) return;
      LI_STATE.rows[idx][key] = value;
      const tr = document.querySelectorAll('#li-container tbody tr')[idx];
      const amtCell = tr && tr.querySelector('.li-amt');
      if (amtCell) amtCell.textContent = '₹' + money(liRowAmount(LI_STATE.rows[idx]));
      liUpdateSummary();
    }
    function liAddRow() { LI_STATE.rows.push(liEmptyRow()); renderLIRows(); }
    function liRemoveRow(idx) { if (LI_STATE.rows.length <= 1) return; LI_STATE.rows.splice(idx, 1); renderLIRows(); }
    function initLineItems(field, existing) {
      let rows = [];
      if (existing && existing.Items) { try { const p = JSON.parse(existing.Items); if (Array.isArray(p) && p.length) rows = p; } catch (e) {} }
      if (!rows.length && existing) {
        const amt = existing.BaseAmount != null && existing.BaseAmount !== '' ? existing.BaseAmount : existing.Amount;
        if (existing.Description || amt) rows = [{ description: existing.Description || '', hsn: '', qty: 1, unit: 'Nos', rate: amt || '' }];
      }
      if (!rows.length) rows = [liEmptyRow()];
      LI_STATE = { hasHsn: !!field.hasHsn, hasGst: !!field.hasGst, rows: rows };
      renderLIRows();
    }

    // ============================================================
    // ADD / EDIT / DELETE
    // ============================================================
    function openEntityModal(entityKey, existing) {
      const cfg = buildEntityConfig()[entityKey]; const isEdit = !!existing;
      const liField = cfg.fields.find(f => f.type === 'lineitems');
      const fieldsHtml = cfg.fields.map(f => renderField(f, existing)).join('');
      const html = `<div class="modal-overlay" id="modal-overlay" onclick="if(event.target.id==='modal-overlay') closeModal()">
        <div class="modal ${liField ? 'modal-lg' : ''}"><div class="modal-head"><h3>${isEdit ? '✏️ Edit' : '➕ Add'} ${cfg.label}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <form id="entity-form">${fieldsHtml}
          <div class="modal-actions" style="flex-basis:100%;"><button type="button" class="btn ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn">✔ ${isEdit ? 'Save Changes' : 'Add ' + cfg.label}</button></div></form></div></div>`;
      document.getElementById('modal-root').innerHTML = html; document.addEventListener('keydown', onModalEsc);
      if (liField) {
        initLineItems(liField, existing);
        const gEl = document.querySelector('#entity-form [name="gstPercent"]');
        if (gEl) gEl.addEventListener('input', liUpdateSummary);
      }
      document.getElementById('entity-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const fd = new FormData(e.target); const payload = {};
        for (const [k, v] of fd.entries()) { if (k.indexOf('__') === 0) continue; payload[k] = v; }
        if (liField) {
          const cleanRows = LI_STATE.rows
            .map(r => ({ description: (r.description || '').trim(), hsn: (r.hsn || '').trim(), qty: parseFloat(r.qty) || 1, unit: (r.unit || 'Nos').trim(), rate: parseFloat(r.rate) || 0 }))
            .filter(r => r.description || r.rate);
          if (!cleanRows.length) { toast('Add at least one line item with a description and rate.', 'error'); return; }
          payload.items = JSON.stringify(cleanRows);
        }
        if (isEdit) { const idCamel = cfg.idField.charAt(0).toLowerCase() + cfg.idField.slice(1); payload[idCamel] = existing[cfg.idField]; }
        const fnName = isEdit ? cfg.update : cfg.add;
        const send = () => {
          showLoading(true);
          google.script.run
            .withSuccessHandler(function(result) {
              showLoading(false); toast(`${cfg.label} ${isEdit ? 'updated' : 'added'} ✅`, 'success'); closeModal();
              // Quick local state update instead of full reload
              if (result && cfg.dataKey && state.data[cfg.dataKey]) {
                if (isEdit) {
                  var idx = state.data[cfg.dataKey].findIndex(r => r[cfg.idField] === result[cfg.idField]);
                  if (idx >= 0) state.data[cfg.dataKey][idx] = result;
                } else {
                  state.data[cfg.dataKey].push(result);
                }
                state.data.dashboard = {}; // will recompute on next render
                computeAllocations(); renderDashboard(); renderCharts(); renderTabContent();
                saveToCache_();
              } else { quickRefresh(); backgroundSync(2000); } // no full reload
            })
            .withFailureHandler(err => { showLoading(false); toast((err && err.message) || 'Save failed.', 'error'); })[fnName](payload);
        };
        const fileInput = e.target.querySelector('input[name="__attachment"]');
        if (fileInput && fileInput.files && fileInput.files[0]) {
          const f = fileInput.files[0];
          if (f.size > 10 * 1024 * 1024) { toast('File is bigger than 10 MB — please choose a smaller file.', 'error'); return; }
          setStatus('Reading file attachment...');
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = String(reader.result || '');
            payload.attachmentData = { fileName: f.name, mimeType: f.type || 'application/octet-stream', base64: dataUrl.substring(dataUrl.indexOf(',') + 1) };
            send();
          };
          reader.onerror = () => toast('Could not read the selected file.', 'error');
          reader.readAsDataURL(f);
        } else send();
      });
    }

    // Auto-fill form fields when an inventory item is picked
    function fillFromItem(sel) {
      const o = sel.options[sel.selectedIndex];
      if (!o || !o.value) return;
      const form = sel.closest('form'); if (!form) return;
      const desc = o.getAttribute('data-desc') || '';
      const rate = o.getAttribute('data-rate') || '';
      const gst = o.getAttribute('data-gst') || '';
      if (document.getElementById('li-container')) {
        // Bills / Quotations: add as a new line item row instead of a paragraph.
        if (LI_STATE.rows.length === 1 && !LI_STATE.rows[0].description && !LI_STATE.rows[0].rate) {
          LI_STATE.rows[0] = { description: desc, hsn: '', qty: 1, unit: 'Nos', rate: rate || '' };
        } else {
          LI_STATE.rows.push({ description: desc, hsn: '', qty: 1, unit: 'Nos', rate: rate || '' });
        }
        renderLIRows();
        if (gst !== '') { const gEl = form.querySelector('[name="gstPercent"]'); if (gEl) { gEl.value = gst; liUpdateSummary(); } }
      } else {
        const setVal = (name, v) => { if (v === '' || v == null) return; const el = form.querySelector(`[name="${name}"]`); if (el) el.value = v; };
        const dEl = form.querySelector('[name="description"]');
        if (dEl && desc) dEl.value = dEl.value.trim() ? (dEl.value.trim() + '\n' + desc) : desc;
        setVal('amount', rate);       // work orders / POs
        setVal('baseAmount', rate);   // purchase bills
        if (gst !== '') setVal('gstPercent', gst);
      }
      sel.value = '';
      toast('Item added: ' + (o.getAttribute('data-name') || '') + ' ✅', 'success');
    }

    function openConfirmModal(message, onConfirm) {
      const html = `<div class="modal-overlay" id="modal-overlay" onclick="if(event.target.id==='modal-overlay') closeModal()">
        <div class="modal confirm-modal"><h3>⚠️ Are you sure?</h3><p>${escapeHtml(message)}</p>
        <div class="confirm-actions"><button class="btn ghost" onclick="closeModal()">Cancel</button>
        <button class="btn danger" id="confirm-yes-btn">Yes, delete</button></div></div></div>`;
      document.getElementById('modal-root').innerHTML = html; document.addEventListener('keydown', onModalEsc);
      document.getElementById('confirm-yes-btn').addEventListener('click', () => { closeModal(); onConfirm(); });
    }

    function deleteEntity(entityKey, id) {
      const cfg = buildEntityConfig()[entityKey];
      openConfirmModal(`This will permanently delete this ${cfg.label.toLowerCase()} record.`, () => {
        showLoading(true);
        google.script.run
          .withSuccessHandler(function() {
            showLoading(false); toast(`${cfg.label} deleted 🗑️`, 'success');
            // Quick local state update
            if (cfg.dataKey && state.data[cfg.dataKey]) {
              state.data[cfg.dataKey] = state.data[cfg.dataKey].filter(r => String(r[cfg.idField]) !== String(id));
              computeAllocations(); renderDashboard(); renderCharts(); renderTabContent(); saveToCache_();
            } else { quickRefresh(); backgroundSync(2000); }
          })
          .withFailureHandler(err => { showLoading(false); toast((err && err.message) || 'Delete failed.', 'error'); })[cfg.del](id);
      });
    }

    // ============================================================
    // FILTERING (search + date range) & SORTING
    // ============================================================
    function applyDateRange(rows, entityKey, dateKey) {
      const f = state.dateFilters[entityKey] || {};
      if (!f.from && !f.to) return rows;
      return rows.filter(r => {
        const d = String(r[dateKey] || '');
        if (!d) return false;
        if (f.from && d < f.from) return false;
        if (f.to && d > f.to) return false;
        return true;
      });
    }
    function getFilteredRows(entityKey, cfg) {
      let rows = state.data[cfg.dataKey] || [];
      const searchTerm = (state.search[entityKey] || '').toLowerCase();
      if (searchTerm) {
        rows = rows.filter(row => cfg.columns.some(col => {
          let display = row[col.key];
          if (col.key === 'CustomerId') display = customerName(row.CustomerId);
          if (col.key === 'SupplierId') display = supplierName(row.SupplierId);
          return String(display || '').toLowerCase().indexOf(searchTerm) > -1;
        }));
      }
      rows = applyDateRange(rows, entityKey, cfg.dateKey || 'Date');
      return rows;
    }
    function onSearch(entityKey, value) {
      state.search[entityKey] = value; renderTabContent();
      requestAnimationFrame(() => { const el = document.querySelector('.search-box'); if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; } });
    }
    function onDateFilter(entityKey, which, value) {
      state.dateFilters[entityKey] = state.dateFilters[entityKey] || {};
      state.dateFilters[entityKey][which] = value;
      state.dateFilters[entityKey].preset = '';
      renderTabContent();
    }
    function setDatePreset(entityKey, preset) {
      const f = state.dateFilters[entityKey] = state.dateFilters[entityKey] || {};
      f.preset = preset;
      if (preset === 'all') { f.from = ''; f.to = ''; }
      else if (preset === 'today') { f.from = todayStr(); f.to = todayStr(); }
      else if (preset === 'month') { f.from = firstOfMonthStr(); f.to = todayStr(); }
      renderTabContent();
    }
    function toggleSort(entityKey, key) {
      const current = state.sort[entityKey];
      state.sort[entityKey] = current && current.key === key ? { key, dir: current.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' };
      renderTabContent();
    }
    function dateFilterToolbar(entityKey) {
      const f = state.dateFilters[entityKey] || {};
      return `<input type="date" class="date-input" value="${escapeHtml(f.from || '')}" onchange="onDateFilter('${entityKey}','from',this.value)" title="From date" />
        <span class="date-sep">→</span>
        <input type="date" class="date-input" value="${escapeHtml(f.to || '')}" onchange="onDateFilter('${entityKey}','to',this.value)" title="To date" />
        <button class="date-chip ${f.preset === 'all' || (!f.from && !f.to) ? 'active' : ''}" onclick="setDatePreset('${entityKey}','all')">All</button>
        <button class="date-chip ${f.preset === 'today' ? 'active' : ''}" onclick="setDatePreset('${entityKey}','today')">Today</button>
        <button class="date-chip ${f.preset === 'month' ? 'active' : ''}" onclick="setDatePreset('${entityKey}','month')">This Month</button>`;
    }

    // ============================================================
    // ENTITY PANEL (table + search + dates + bulk + print + attach)
    // ============================================================
    function renderEntityPanel(entityKey) {
      const cfg = buildEntityConfig()[entityKey];
      const allRows = state.data[cfg.dataKey] || [];
      let rows = getFilteredRows(entityKey, cfg);
      const df = state.dateFilters[entityKey] || {};
      const filtering = (state.search[entityKey] || '') || df.from || df.to;

      const sort = state.sort[entityKey];
      if (sort) {
        rows = rows.slice().sort((a, b) => {
          const col = cfg.columns.find(c => c.key === sort.key);
          let av = a[sort.key], bv = b[sort.key];
          if (col && col.numeric) { av = Number(av) || 0; bv = Number(bv) || 0; }
          else if (/date/i.test(sort.key)) { av = String(av || ''); bv = String(bv || ''); }
          else { av = String(av || '').toLowerCase(); bv = String(bv || '').toLowerCase(); }
          if (av < bv) return sort.dir === 'asc' ? -1 : 1;
          if (av > bv) return sort.dir === 'asc' ? 1 : -1;
          return 0;
        });
      }

      const headHtml = `<th style="width:40px; cursor:default;" title="Serial No.">#</th>` + cfg.columns.map(col => {
        const isSorted = sort && sort.key === col.key;
        const arrow = isSorted ? (sort.dir === 'asc' ? '▲' : '▼') : '';
        return `<th onclick="toggleSort('${entityKey}','${col.key}')">${col.label}<span class="arrow">${arrow}</span></th>`;
      }).join('') + `<th class="actions-col">Actions</th>`;

      const bodyHtml = rows.length ? rows.map((row, idx) => {
        const cells = `<td class="num" style="color:#94a3b8; font-weight:700;">${idx + 1}</td>` + cfg.columns.map(col => {
          const raw = row[col.key];
          const display = col.render ? col.render(raw, row) : escapeHtml(raw);
          return `<td class="${col.wrap ? 'wrap' : ''} ${col.numeric ? 'num' : ''}">${display}</td>`;
        }).join('');
        const id = row[cfg.idField];
        const rowJson = JSON.stringify(row).replace(/'/g, '&#39;');
        const printBtn = cfg.printable ? `<button class="btn ghost small icon" title="Print / Download ${cfg.printable === 'bill' ? 'Invoice' : 'Quotation'}" onclick="openPrintChooser('${entityKey}','${id}')">🖨️</button>` : '';
        return `<tr>${cells}<td class="actions-col"><div class="row-actions">${printBtn}<button class="btn ghost small" onclick='openEntityModal("${entityKey}", ${rowJson})'>Edit</button><button class="btn danger small" onclick="deleteEntity('${entityKey}','${id}')">Delete</button></div></td></tr>`;
      }).join('') : `<tr><td colspan="${cfg.columns.length + 2}"><div class="empty-hint">📭 No records found${filtering ? ' for the current filters' : ''}. Try widening the date range or clearing search.</div></td></tr>`;

      const rangeLabel = (df.from || df.to) ? `<span class="date-chip active">📅 ${df.from ? fmtDate(df.from) : '…'} → ${df.to ? fmtDate(df.to) : '…'}</span>` : '';
      return `<div class="panel">
        <div class="panel-head">
          <h3>${cfg.label} List (${rows.length}${filtering ? ' of ' + allRows.length : ''}) ${rangeLabel}</h3>
          <div class="toolbar">
            <input class="search-box" placeholder="🔍 Search ${cfg.label.toLowerCase()}s..." value="${escapeHtml(state.search[entityKey] || '')}" oninput="onSearch('${entityKey}', this.value)" />
            ${dateFilterToolbar(entityKey)}
          </div>
        </div>
        <div class="toolbar" style="margin-bottom:10px;">
          <button class="btn warn small" onclick="openEntityBulk('${entityKey}')" title="Bulk upload many ${cfg.label.toLowerCase()} records from Excel/CSV (template inside)">📥 Bulk Upload</button>
          <button class="btn ghost small" onclick="exportEntity('${entityKey}','csv')" title="Download CSV">CSV</button>
          <button class="btn ghost small" onclick="exportEntity('${entityKey}','excel')" title="Download Excel (.xlsx)">Excel</button>
          <button class="btn ghost small" onclick="exportEntity('${entityKey}','pdf')" title="Download PDF">PDF</button>
          <button class="btn small" onclick="openEntityModal('${entityKey}')">➕ Add ${cfg.label}</button>
        </div>
        <div class="table-wrap"><table><thead><tr>${headHtml}</tr></thead><tbody>${bodyHtml}</tbody></table></div>
      </div>`;
    }

    // ============================================================
    // EXPORT HELPERS — CSV / EXCEL / PDF (all tabs)
    // ============================================================
    function stripHtml_(v) { return String(v == null ? '' : v).replace(/<[^>]*>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"); }
    function exportEntity(entityKey, format) {
      const cfg = buildEntityConfig()[entityKey];
      const rows = getFilteredRows(entityKey, cfg).map((row, i) => {
        const out = { SNo: i + 1 };
        Object.assign(out, row);
        if (out.CustomerId !== undefined) out.CustomerId = customerName(out.CustomerId);
        if (out.SupplierId !== undefined) out.SupplierId = supplierName(out.SupplierId);
        return out;
      });
      const cols = [{ key: 'SNo', label: '#' }].concat(cfg.columns);
      exportRows(entityKey, cfg.label + ' List', cols, rows, format);
    }
    function exportRows(filenameBase, title, columns, rows, format) {
      if (!rows.length) { toast('Nothing to export — no rows in the current view.', 'error'); return; }
      if (format === 'csv') downloadCsv(filenameBase + '.csv', columns, rows);
      else if (format === 'excel') downloadExcel(filenameBase + '.xlsx', columns, rows);
      else downloadPdf(filenameBase + '.pdf', title, columns, rows);
      toast(`${title} exported as ${format.toUpperCase()} ⬇️ (${rows.length} rows)`, 'success');
    }
    function downloadExcel(filename, columns, rows) {
      if (typeof XLSX === 'undefined') { toast('Excel library not loaded — check internet, or use CSV instead.', 'error'); return; }
      const aoa = [columns.map(c => c.label)].concat(rows.map(r => columns.map(c => r[c.key] == null ? '' : r[c.key])));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = columns.map(c => ({ wch: Math.max(10, String(c.label).length + 2, 14) }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data');
      XLSX.writeFile(wb, filename);
    }
    function downloadPdf(filename, title, columns, rows) {
      if (!window.jspdf || !window.jspdf.jsPDF) { toast('PDF library not loaded — check internet, or use CSV/Excel instead.', 'error'); return; }
      const co = (state.data && state.data.company) || { name: 'KGS ENGINEERING WORKS' };
      const doc = new window.jspdf.jsPDF({ orientation: columns.length > 6 ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
      doc.setFontSize(14); doc.setTextColor(49, 46, 129); doc.text(co.name || 'KGS ENGINEERING WORKS', 14, 14);
      doc.setFontSize(11); doc.setTextColor(30, 41, 59); doc.text(title, 14, 21);
      doc.setFontSize(8); doc.setTextColor(100, 116, 139);
      doc.text('Generated: ' + new Date().toLocaleString('en-IN') + '   ·   Rows: ' + rows.length, 14, 27);
      doc.autoTable({
        head: [columns.map(c => c.label)],
        body: rows.map(r => columns.map(c => stripHtml_(r[c.key]))),
        startY: 31,
        styles: { fontSize: 7.5, cellPadding: 1.6 },
        headStyles: { fillColor: [67, 56, 202], textColor: 255, fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [245, 243, 255] }
      });
      doc.save(filename);
    }
    function exportByKey(key, format) {
      const reg = (state.exports || {})[key];
      if (!reg) { toast('Nothing to export yet.', 'error'); return; }
      const rows = reg.rows.map(r => { const o = {}; reg.cols.forEach((c, i) => { o[c.key] = r[i]; }); return o; });
      exportRows(key, reg.title, reg.cols, rows, format);
    }

    function numberToWords(num) {
      num = Math.abs(Number(num) || 0);
      const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
      const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
      const two = n => n < 20 ? ones[n] : tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
      const three = n => { const h = Math.floor(n / 100), r = n % 100; return (h ? ones[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? two(r) : ''); };
      const crore = Math.floor(num / 1e7), lakh = Math.floor((num % 1e7) / 1e5), thou = Math.floor((num % 1e5) / 1000), rest = Math.floor(num % 1000);
      let w = '';
      if (crore) w += three(crore) + ' Crore ';
      if (lakh) w += two(lakh) + ' Lakh ';
      if (thou) w += two(thou) + ' Thousand ';
      if (rest) w += three(rest);
      w = w.trim() || 'Zero';
      const paise = Math.round((num - Math.floor(num)) * 100);
      let s = 'Rupees ' + w;
      if (paise > 0) s += ' and ' + two(paise) + ' Paise';
      return s + ' Only';
    }

    function onEntityBulkFile(input) {
      const file = input.files[0]; if (!file) return;
      const previewEl = document.getElementById('ebulk-preview');
      previewEl.innerHTML = '<div style="color:var(--muted); font-size:13px; padding:8px;">Reading file...</div>';
      document.getElementById('ebulk-confirm').disabled = true; entityBulkData = null;

        if (err) { previewEl.innerHTML = `<div style="color:#be123c; padding:8px;">Parse error: ${escapeHtml(String(err.message || err))}</div>`; return; }
        if (!rows.length || rows.length < 2) { previewEl.innerHTML = '<div style="color:#b45309; padding:8px;">File appears empty or has only a header row.</div>'; return; }
        const headerRow = rows[0].map(h => String(h == null ? '' : h).trim());

          .filter(r => r.some(v => String(v).trim() !== ''))
          .map(r => { const o = {}; headerRow.forEach((h, i) => { o[h] = r[i] !== undefined ? r[i] : ''; }); return o; });

    // ============================================================
    // FILE / CSV PARSING HELPERS (client-side)
    // ============================================================
    function readTabularFile(file, cb) {
      readWorkbook(file, (err, wb, csvRows) => {
        if (err) return cb(err);
        if (wb) return cb(null, XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }));
        cb(null, csvRows);
      });
    }
    function readWorkbook(file, cb) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          if (file.name.toLowerCase().endsWith('.csv')) return cb(null, null, parseCsv(e.target.result));
          if (typeof XLSX === 'undefined') throw new Error('XLSX parser not loaded — upload CSV instead or check internet.');
          cb(null, XLSX.read(new Uint8Array(e.target.result), { type: 'array' }), null);
        } catch (err) { cb(err); }
      };
      reader.onerror = () => cb(new Error('Could not read file.'));
      if (file.name.toLowerCase().endsWith('.csv')) reader.readAsText(file); else reader.readAsArrayBuffer(file);
    }
    function parseCsv(text) {
      const lines = String(text || '').split(/\r?\n/).filter(line => line.trim() !== '');
      return lines.map(line => {
        const out = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i], next = line[i + 1];
          if (inQ) { if (ch === '"' && next === '"') { cur += '"'; i++; } else if (ch === '"') inQ = false; else cur += ch; }
          else { if (ch === '"') inQ = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; }
        }
        out.push(cur); return out;
      });
    }
    function mapSheetNameToEntity(name) {
      const n = String(name || '').trim().toLowerCase();
      const map = {
        customers: 'Customers', customer: 'Customers',
        suppliers: 'Suppliers', supplier: 'Suppliers',
        workorders: 'WorkOrders', 'work orders': 'WorkOrders', 'work order': 'WorkOrders', workorder: 'WorkOrders',
        purchaseorders: 'PurchaseOrders', 'purchase orders': 'PurchaseOrders', 'purchase order': 'PurchaseOrders', purchaseorder: 'PurchaseOrders', po: 'PurchaseOrders',
        inventory: 'Inventory', stock: 'Inventory', items: 'Inventory', item: 'Inventory', 'inventory items': 'Inventory', 'stock items': 'Inventory',
        paymentsin: 'PaymentsIn', 'payments in': 'PaymentsIn', 'payment in': 'PaymentsIn',
        expensesout: 'ExpensesOut', 'expenses out': 'ExpensesOut', 'expense out': 'ExpensesOut', expenses: 'ExpensesOut', expense: 'ExpensesOut',
        paymentsout: 'ExpensesOut', 'payments out': 'ExpensesOut', 'payment out': 'ExpensesOut',
        cashbook: 'CashBook', 'cash book': 'CashBook', cash: 'CashBook',
        quotations: 'Quotations', quotation: 'Quotations',
        bills: 'Bills', bill: 'Bills', 'sales invoice': 'Bills', 'sales invoices': 'Bills',
        purchasebills: 'PurchaseBills', 'purchase bills': 'PurchaseBills', 'purchase bill': 'PurchaseBills',
        gstreturns: 'GstReturns', 'gst returns': 'GstReturns', 'gst return': 'GstReturns', gst: 'GstReturns',
        directorsbook: 'DirectorsBook', 'directors book': 'DirectorsBook', directors: 'DirectorsBook', director: 'DirectorsBook', 'director book': 'DirectorsBook', 'directors books': 'DirectorsBook'
      };
      return map[n] || null;
    }
    function detectEntityByHeaders(headers) {
      const names = headers.map(h => String(h || '').trim().toLowerCase());
      const has = (...ws) => names.some(n => ws.some(w => n === w || n.includes(w)));
      if (has('itemname', 'stockqty', 'minstock') || (has('rate') && has('unit'))) return 'Inventory';
      if (has('director')) return 'DirectorsBook';
      if (has('purchaseorder', 'purchase order', 'pono', 'po no')) return 'PurchaseOrders';
      if (has('workorder', 'work order', 'workorderno')) return 'WorkOrders';
      if (has('quotation')) return 'Quotations';
      if (has('billno', 'bill no', 'gstpercent')) return 'Bills';
      if (has('period', 'gstr1status')) return 'GstReturns';
      if (has('mode') && has('reference') && has('customer')) return 'PaymentsIn';
      if (has('category') && has('mode') && has('supplier')) return 'ExpensesOut';
      if (has('type') && has('category') && !has('supplier')) return 'CashBook';
      if (has('name') && has('phone')) return has('supplier') ? 'Suppliers' : 'Customers';
      return null;
    }

    function parseBankStatementRows(headerRow, dataRows) {
      const headers = headerRow.map(h => String(h || '').trim().toLowerCase());
      const findCol = kws => { for (let i = 0; i < headers.length; i++) if (kws.some(k => headers[i].includes(k))) return i; return -1; };
      // Exact-match finder (for short keywords like 'cr', 'dr' that could false-match longer headers)
      const findColExact = kws => { for (let i = 0; i < headers.length; i++) if (kws.some(k => headers[i] === k)) return i; return -1; };

      const dateIdx = findCol(['date', 'transaction date', 'txn date', 'value date']);
      const descIdx = findCol(['description', 'particulars', 'narration', 'transaction details', 'details', 'remarks']);
      const refIdx = findCol(['reference', 'ref', 'utr', 'transaction id', 'txn id', 'cheque']);

      // ── Dr/Cr indicator column ──
      // Matches headers like "Dr/Cr", "Credit/Debit", "Debit/Credit", "Dr./Cr.", "Cr/Dr", "dr cr", "Txn Type" etc.
      const drCrIdx = findCol(['dr/cr', 'dr./cr.', 'cr/dr', 'cr./dr.', 'dr / cr', 'cr / dr', 'dr cr', 'cr dr', 'credit/debit', 'debit/credit', 'credit / debit', 'debit / credit']);

      // ── Separate Credit & Debit columns ──
      // Use exact match first for 'cr'/'dr', then fall back to includes-match for longer keywords.
      // But skip any column already used as the Dr/Cr indicator.
      let creditIdx = findColExact(['credit', 'deposit', 'cr', 'cr.']);
      if (creditIdx >= 0 && creditIdx === drCrIdx) creditIdx = -1; // don't reuse the indicator column
      let debitIdx = findColExact(['debit', 'withdrawal', 'dr', 'dr.']);
      if (debitIdx >= 0 && debitIdx === drCrIdx) debitIdx = -1;
      // Fallback includes-match (for headers like "Credit Amount", "Debit Amount")
      if (creditIdx < 0) { creditIdx = findCol(['credit', 'deposit']); if (creditIdx >= 0 && creditIdx === drCrIdx) creditIdx = -1; }
      if (debitIdx < 0) { debitIdx = findCol(['debit', 'withdrawal']); if (debitIdx >= 0 && debitIdx === drCrIdx) debitIdx = -1; }
      // If creditIdx and debitIdx ended up on the SAME column, it's an indicator column — treat it as drCr
      if (creditIdx >= 0 && debitIdx >= 0 && creditIdx === debitIdx) {
        // This is really a Dr/Cr indicator column (e.g. header "Credit/Debit"), not separate amount columns
        if (drCrIdx < 0) { /* drCrIdx is const, so we handle this in the row loop below via a flag */ }
        creditIdx = -1; debitIdx = -1;
      }
      // Detect if creditIdx/debitIdx ended up pointing to a non-numeric indicator column (values are "Dr"/"Cr" text, not amounts)
      const _effectiveDrCrIdx = drCrIdx >= 0 ? drCrIdx : (creditIdx >= 0 && debitIdx < 0 ? (function() {
        // If only one of credit/debit matched and it's actually a combined header like "Credit/Debit"
        const h = headers[creditIdx]; return (h.includes('debit') || h.includes('dr')) ? creditIdx : -1;
      })() : (debitIdx >= 0 && creditIdx < 0 ? (function() {
        const h = headers[debitIdx]; return (h.includes('credit') || h.includes('cr')) ? debitIdx : -1;
      })() : -1));
      // Clean up: if _effectiveDrCrIdx identified a new indicator column, clear credit/debit pointing to it
      if (_effectiveDrCrIdx >= 0 && _effectiveDrCrIdx !== drCrIdx) {
        if (creditIdx === _effectiveDrCrIdx) creditIdx = -1;
        if (debitIdx === _effectiveDrCrIdx) debitIdx = -1;
      }
      const finalDrCrIdx = _effectiveDrCrIdx >= 0 ? _effectiveDrCrIdx : drCrIdx;

      // ── Single Amount column ──
      let amountIdx = findCol(['amount', 'transaction amount', 'amt']);
      // If amount column was not found, try 'value' but avoid conflicts
      if (amountIdx < 0) amountIdx = findCol(['value']);

      const typeIdx = findCol(['type', 'transaction type', 'category']);

      const transactions = [];
      dataRows.forEach(row => {
        const rawDate = dateIdx >= 0 ? row[dateIdx] : '';
        const rawDesc = descIdx >= 0 ? row[descIdx] : '';
        const rawCredit = creditIdx >= 0 ? row[creditIdx] : '';
        const rawDebit = debitIdx >= 0 ? row[debitIdx] : '';
        const rawAmount = amountIdx >= 0 ? row[amountIdx] : '';
        const rawRef = refIdx >= 0 ? row[refIdx] : '';
        const rawType = typeIdx >= 0 ? row[typeIdx] : '';
        const rawDrCr = finalDrCrIdx >= 0 ? String(row[finalDrCrIdx] || '').trim().toLowerCase() : '';
        if (!rawDate && !rawDesc && !rawCredit && !rawDebit && !rawAmount && !rawRef && !rawType && !rawDrCr) return;

        let direction = 'Unknown', amount = 0;

        // ── CASE 1: Separate Credit & Debit columns exist ──
        const creditVal = parseBankAmount_(rawCredit), debitVal = parseBankAmount_(rawDebit);
        if (creditIdx >= 0 && debitIdx >= 0 && (creditVal > 0 || debitVal > 0)) {
          if (creditVal > 0 && debitVal === 0) { direction = 'Credit'; amount = creditVal; }
          else if (debitVal > 0 && creditVal === 0) { direction = 'Debit'; amount = debitVal; }
          else if (creditVal > 0) { direction = 'Credit'; amount = creditVal; }
          else { direction = 'Debit'; amount = debitVal; }
        }
        // ── CASE 2: Dr/Cr indicator column + Amount column ──
        else if (finalDrCrIdx >= 0) {
          const amtVal = parseBankAmount_(rawAmount !== '' ? rawAmount : (rawCredit !== '' ? rawCredit : rawDebit));
          amount = Math.abs(amtVal);
          if (rawDrCr === 'cr' || rawDrCr === 'cr.' || rawDrCr.includes('credit') || rawDrCr === 'c') {
            direction = 'Credit';
          } else if (rawDrCr === 'dr' || rawDrCr === 'dr.' || rawDrCr.includes('debit') || rawDrCr === 'd') {
            direction = 'Debit';
          } else if (amtVal > 0) { direction = 'Credit'; }
          else if (amtVal < 0) { direction = 'Debit'; amount = Math.abs(amtVal); }
        }
        // ── CASE 3: Single amount column — check for embedded Dr/Cr suffix/prefix ──
        else {
          const amtStr = String(rawAmount !== '' ? rawAmount : (rawCredit !== '' ? rawCredit : rawDebit));
          const amtLower = amtStr.toLowerCase().trim();
          const singleVal = parseBankAmount_(amtStr);
          const typeStr = String(rawType || '').toLowerCase().trim();

          // Check embedded Dr/Cr in the amount string itself (e.g. "25,000.00 Dr" or "Cr 15,000.00")
          const hasDr = /\bdr\.?\b/i.test(amtStr);
          const hasCr = /\bcr\.?\b/i.test(amtStr);

          if (hasCr && !hasDr) { direction = 'Credit'; amount = Math.abs(singleVal); }
          else if (hasDr && !hasCr) { direction = 'Debit'; amount = Math.abs(singleVal); }
          // Check Type/Category column for Dr/Cr keywords
          else if (typeStr === 'cr' || typeStr === 'cr.' || typeStr.includes('credit')) { direction = 'Credit'; amount = Math.abs(singleVal); }
          else if (typeStr === 'dr' || typeStr === 'dr.' || typeStr.includes('debit') || typeStr.includes('withdrawal')) { direction = 'Debit'; amount = Math.abs(singleVal); }
          // Fallback: positive = Credit, negative = Debit
          else if (singleVal > 0) { direction = 'Credit'; amount = singleVal; }
          else if (singleVal < 0) { direction = 'Debit'; amount = Math.abs(singleVal); }
          else amount = Math.max(creditVal, debitVal);
        }

        if (!(amount > 0)) return;
        const dateStr = formatBankDate_(rawDate);
        const description = String(rawDesc || '').trim();
        const referenceNo = String(rawRef || '').trim();
        const detectedDirector = guessDirector_(description, referenceNo);
        const counterparty = detectedDirector ? { type: 'Director', id: '', name: detectedDirector, label: '🤝 ' + detectedDirector } : guessCounterparty_(description, referenceNo);
        const mode = guessPaymentMode_(description);
        const category = guessCategory_(description);
        // Smart mapping: Credit → customerId for PaymentsIn; Debit → supplierId for ExpensesOut
        let mappedCustomerId = '', mappedCustomerName = '', mappedSupplierId = '', mappedSupplierName = '';
        if (direction === 'Credit') {
          // For credits (Payment In): prefer Customer match; if Supplier matched, still note it
          if (counterparty.type === 'Customer') { mappedCustomerId = counterparty.id; mappedCustomerName = counterparty.name; }
          else if (counterparty.type === 'Supplier') { mappedCustomerName = counterparty.name + ' (Supplier)'; }
        } else if (direction === 'Debit') {
          // For debits (Expense Out): prefer Supplier match; if Customer matched, still note it
          if (counterparty.type === 'Supplier') { mappedSupplierId = counterparty.id; mappedSupplierName = counterparty.name; }
          else if (counterparty.type === 'Customer') { mappedSupplierName = counterparty.name + ' (Customer)'; }
        }
        transactions.push({
          date: dateStr, direction: direction, amount: +amount.toFixed(2),
          description: description, referenceNo: referenceNo, mode: mode, category: category,
          detectedCounterparty: counterparty.label || '', detectedDirector: detectedDirector,
          customerId: mappedCustomerId, customerName: mappedCustomerName,
          supplierId: mappedSupplierId, supplierName: mappedSupplierName
        });
      });
      return transactions;
    }
    function parseBankAmount_(value) {
      if (value === '' || value === null || value === undefined) return 0;
      if (typeof value === 'number') return value;
      // Strip currency symbols, commas, spaces, and Dr/Cr indicators before parsing
      const cleaned = String(value).replace(/[₹$,\s]/g, '').replace(/\b(dr|cr)\.?\b/gi, '').trim();
      const n = parseFloat(cleaned);
      return isNaN(n) ? 0 : n;
    }
    function formatBankDate_(value) {
      if (value === '' || value === null || value === undefined) return '';
      if (value instanceof Date && !isNaN(value)) return value.getFullYear() + '-' + pad2(value.getMonth() + 1) + '-' + pad2(value.getDate());
      if (typeof value === 'number') { // Excel serial date
        if (value > 20000 && value < 80000) { const d = new Date(Math.round((value - 25569) * 86400 * 1000)); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
        return String(value);
      }
      const str = String(value).trim();
      let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
      m = str.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})/); if (m) return m[3] + '-' + m[2] + '-' + m[1];
      try { const d = new Date(str); if (!isNaN(d)) return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); } catch (e) {}
      return str;
    }
    function guessDirector_(description, reference) {
      const hay = (String(description || '') + ' ' + String(reference || '')).toUpperCase();
      const dirs = state.data.directors || [];
      for (const name of dirs) {
        const full = String(name).toUpperCase();
        if (hay.indexOf(full) > -1) return name;
        const parts = full.split(/\s+/);
        const first = parts[0], last = parts[parts.length - 1];
        if (first.length >= 5 && last.length >= 5 && hay.indexOf(first) > -1 && hay.indexOf(last) > -1) return name;
      }
      return '';
    }
    function guessCounterparty_(description, reference) {
      const combined = (String(description || '') + ' ' + String(reference || '')).toLowerCase();
      // --- Match against customers (try full name, then individual words ≥ 4 chars) ---
      for (const c of (state.data.customers || [])) {
        const n = String(c.Name || '').toLowerCase();
        if (n.length >= 3 && combined.includes(n)) return { type: 'Customer', id: c.CustomerId, name: c.Name, label: c.Name + ' (Customer)' };
      }
      for (const c of (state.data.customers || [])) {
        const words = String(c.Name || '').toLowerCase().split(/\s+/).filter(w => w.length >= 4);
        if (words.length && words.some(w => combined.includes(w))) return { type: 'Customer', id: c.CustomerId, name: c.Name, label: c.Name + ' (Customer)' };
      }
      // --- Match against suppliers (try full name, then individual words ≥ 4 chars) ---
      for (const s of (state.data.suppliers || [])) {
        const n = String(s.Name || '').toLowerCase();
        if (n.length >= 3 && combined.includes(n)) return { type: 'Supplier', id: s.SupplierId, name: s.Name, label: s.Name + ' (Supplier)' };
      }
      for (const s of (state.data.suppliers || [])) {
        const words = String(s.Name || '').toLowerCase().split(/\s+/).filter(w => w.length >= 4);
        if (words.length && words.some(w => combined.includes(w))) return { type: 'Supplier', id: s.SupplierId, name: s.Name, label: s.Name + ' (Supplier)' };
      }
      // --- Fallback keyword detection ---
      const d = String(description || '').toLowerCase();
      if (/(salary|rent|utility|electricity|phone|internet|invoice|bill|purchase|material)/.test(d)) return { type: 'Expense', id: '', name: '', label: 'Expense (Auto-detected)' };
      return { type: 'Unknown', id: '', name: '', label: '' };
    }
    function guessPaymentMode_(description) {
      const d = String(description || '').toUpperCase();
      if (/\bUPI\b/.test(d)) return 'UPI';
      if (/\bNEFT\b/.test(d) || /\bRTGS\b/.test(d)) return 'NEFT/RTGS';
      if (/\bIMPS\b/.test(d)) return 'NEFT/RTGS';
      if (/\bCHEQUE\b|\bCHQ\b|\bCHECK\b/.test(d)) return 'Cheque';
      if (/\bCASH\b|\bATM\b|\bCDM\b/.test(d)) return 'Cash';
      return 'Online';
    }
    function guessCategory_(description) {
      const d = String(description || '').toLowerCase();
      if (/(salary|wage|payroll)/.test(d)) return 'Salary';
      if (/(rent|lease)/.test(d)) return 'Rent';
      if (/(electricity|electric|power|utility|water|gas)/.test(d)) return 'Utility';
      if (/(phone|mobile|telecom|internet|broadband|recharge)/.test(d)) return 'Communication';
      if (/(transport|freight|courier|shipping|logistics)/.test(d)) return 'Transport';
      if (/(material|steel|cement|hardware|supply|purchase)/.test(d)) return 'Material';
      if (/(labour|labor|contractor|manpower)/.test(d)) return 'Labour';
      if (/(insurance|premium)/.test(d)) return 'Insurance';
      if (/(tax|gst|tds)/.test(d)) return 'Tax';
      if (/(fuel|diesel|petrol)/.test(d)) return 'Fuel';
      return 'General';
    }
