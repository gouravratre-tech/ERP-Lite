    function parsePurchaseBillText(text) {
      var result = { date: '', billNo: '', supplierName: '', supplierAddress: '', supplierGstin: '', supplierState: '', baseAmount: '', gstPercent: 18, totalAmount: '', description: '', hsnSac: '', quantity: '' };
      var lines = text.split(/\n/).map(function(l) { return l.trim(); }).filter(function(l) { return l; });
      var fullText = text.replace(/\s+/g, ' ');
      var addrKeywords = /\b(SHOP|PLOT|NO\.|FLAT|FLOOR|BUILDING|HOUSE|C\/O|ROAD|NAGAR|COLONY|WARD|SECTOR|BLOCK|DIST|AREA|STREET|LANE|MAIN|UNIT|GALI|MARG|PATH|NEAR)\b/i;

      // 1. SUPPLIER BLOCK (between "Tax Invoice" and "Consignee/Buyer/Invoice")
      var supplierBlock = [], inBlock = false;
      for (var i = 0; i < lines.length; i++) {
        if (/^Tax Invoice/i.test(lines[i])) { inBlock = true; continue; }
        if (inBlock) {
          var gstinMatch = lines[i].match(/GSTIN\/UIN[:\s]*(\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z\d]{2})/i);
          if (gstinMatch) {
            result.supplierGstin = gstinMatch[1];
            var before = lines[i].split(/GSTIN\/UIN/i)[0].trim();
            if (before.length > 3 && !result.supplierName) {
              var am = before.match(addrKeywords);
              if (am) { result.supplierName = before.substring(0, am.index).trim(); result.supplierAddress = before.substring(am.index).trim(); }
              else { result.supplierName = before; }
            }
            continue;
          }
          if (/^State Name/i.test(lines[i]) || /State Name\s*:/i.test(lines[i])) {
            var sm = lines[i].match(/State Name\s*:\s*(.+)/i); if (sm) result.supplierState = sm[1].trim(); continue;
          }
          if (/^(Consignee|Ship to|Buyer|Bill to|Invoice|Dated|Mode)/i.test(lines[i])) { inBlock = false; break; }
          supplierBlock.push(lines[i]);
        }
      }
      if (supplierBlock.length > 0 && !result.supplierName) {
        result.supplierName = supplierBlock[0];
        if (supplierBlock.length > 1) result.supplierAddress = supplierBlock.slice(1).join(', ');
      }
      if (!result.supplierGstin) { var gf = text.match(/GSTIN\/UIN[:\s]*(\d{2}[A-Z]{5}\d{4}[A-Z]\d[A-Z\d]{2})/i); if (gf) result.supplierGstin = gf[1]; }

      // 2. DATE
      for (var i = 0; i < lines.length; i++) {
        if (/^Dated?\s*$/i.test(lines[i]) && i+1<lines.length) { var nxt=lines[i+1]; if(/\d/.test(nxt)&&!/mode|term/i.test(nxt)){result.date=formatBankDate_(nxt);break;} }
        var dm = lines[i].match(/Dated?\s+(\d{1,2}[-\/\.]\w{3,9}[-\/\.]\d{2,4}|\d{1,2}[-\/\.]\d{1,2}[-\/\.]\d{2,4})/i);
        if (dm) { result.date = formatBankDate_(dm[1]); break; }
      }

      // 3. INVOICE NUMBER
      for (var i = 0; i < lines.length; i++) {
        if (/^Invoice\s*No\.?\s*$/i.test(lines[i]) && i+1<lines.length) { result.billNo=lines[i+1]; break; }
        var bm = lines[i].match(/Invoice\s*No\.?\s+([\w\/-]+\d[\w\/-]*)/i);
        if (bm) { result.billNo=bm[1].trim(); break; }
      }

      // 4. GST %
      var rm2 = fullText.match(/(\d+)%/);
      if (rm2) { var g = parseFloat(rm2[1]); result.gstPercent = g <= 14 ? g * 2 : g; }

      // 5. TOTAL AMOUNT
      var tm = fullText.match(/Total\s+₹\s*([\d,]+(?:\.\d{1,2})?)/);
      if (tm) result.totalAmount = parseFloat(tm[1].replace(/,/g,''));

      // 6. DESCRIPTION + QUANTITY + HSN from item row
      for (var i = 0; i < lines.length; i++) {
        var itemMatch = lines[i].match(/^\d+[\s.)]+(.+)/);
        if (!itemMatch) continue;
        var afterNum = itemMatch[1].trim();
        if (/^(Description|Particulars|Sl|HSN)/i.test(afterNum)) continue;
        var descAmtMatch = afterNum.match(/^(.+?)\s+([\d,]+\.\d{2})\b/);
        if (descAmtMatch) result.description = descAmtMatch[1].trim();
        else result.description = afterNum;
        var qtyMatches = [];
        var qr = lines[i].matchAll(/([\d.]+)\s*(MTS|KG|NOS|PCS|LTR|MTR|SET|BAG|SQFT)\b/gi);
        for (var qm of qr) { if (parseFloat(qm[1]) > 0 && parseFloat(qm[1]) < 10000) qtyMatches.push(qm); }
        if (qtyMatches.length > 0) { qtyMatches.sort(function(a,b) { return parseFloat(a[1]) - parseFloat(b[1]); }); result.quantity = qtyMatches[0][1] + ' ' + qtyMatches[0][2].toUpperCase(); }
        var hsnInLine = lines[i].match(/\b(\d{6,8})\b/);
        if (hsnInLine) result.hsnSac = hsnInLine[1];
        break;
      }
      // Fallback: quantity from any line
      if (!result.quantity) { for (var i = 0; i < lines.length; i++) { var qm = lines[i].match(/^([\d.]+)\s*(MTS|KG|NOS|PCS|LTR|MTR|SET|BAG|SQFT)\b/i); if (qm && parseFloat(qm[1]) < 10000 && parseFloat(qm[1]) > 0) { result.quantity=qm[1]+' '+qm[2].toUpperCase(); break; } } }
      // Fallback: HSN from text (skip pincodes)
      if (!result.hsnSac) { var hsnC = fullText.matchAll(/\b(\d{6,8})\b/g); for (var hc of hsnC) { var ctx=fullText.substring(Math.max(0,hc.index-80),hc.index+20).toLowerCase(); if(/nagar|road|vihar|colony|raigarh|raipur|tarapur|sumitra|boirdadar|house|plot/.test(ctx))continue; result.hsnSac=hc[1]; break; } }
      if (!result.description) result.description = 'Purchase from ' + (result.supplierName || 'Supplier');

      // 7. BASE / TAXABLE AMOUNT (appears ≥2 times, less than total)
      var amtCounts = {};
      var allAmts = fullText.matchAll(/([\d,]+\.\d{2})/g);
      for (var m of allAmts) { var v=parseFloat(m[1].replace(/,/g,'')); if(v>0)amtCounts[v]=(amtCounts[v]||0)+1; }
      var total = result.totalAmount||0, best = 0;
      Object.keys(amtCounts).forEach(function(v) { var n=parseFloat(v); if(amtCounts[v]>=2&&n>best&&(total===0||n<total)&&n>100)best=n; });
      if (best > 0) result.baseAmount = best;
      if (!result.baseAmount && result.totalAmount && result.gstPercent) result.baseAmount = Math.round(result.totalAmount/(1+result.gstPercent/100)*100)/100;

      return result;
    }

    function matchSupplierByName(name, gstin) {
      var suppliers = state.data.suppliers || [];
      if (gstin) { for (var i = 0; i < suppliers.length; i++) { if (String(suppliers[i].GSTNumber || '').toUpperCase() === String(gstin).toUpperCase()) return suppliers[i].SupplierId; } }
      var hay = String(name || '').toLowerCase();
      for (var i = 0; i < suppliers.length; i++) { var n = String(suppliers[i].Name || '').toLowerCase(); if (hay.includes(n) || n.includes(hay)) return suppliers[i].SupplierId; }
      for (var i = 0; i < suppliers.length; i++) {
        var words = String(suppliers[i].Name || '').toLowerCase().split(/\s+/).filter(function(w) { return w.length >= 4; });
        if (words.length && words.some(function(w) { return hay.includes(w); })) return suppliers[i].SupplierId;
      }
      return '';
    }


    // ── Extract text from a single PDF with timeout & cleanup ──
    function extractTextFromPdf(file, timeoutMs) {
      timeoutMs = timeoutMs || 15000;
      return new Promise(function(resolve) {
        var timer = setTimeout(function() { resolve({ error: 'Timeout — PDF took too long (' + (timeoutMs/1000) + 's)', text: '' }); }, timeoutMs);

        file.arrayBuffer().then(function(arrayBuffer) {
          var loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
          loadingTask.promise.then(function(pdf) {
            var fullText = '';
            var pagesDone = 0;
            var numPages = pdf.numPages;

            function processPage(pageNum) {
              if (pageNum > numPages) {
                clearTimeout(timer);
                pdf.destroy(); // Free memory
                resolve({ error: null, text: fullText });
                return;
              }
              pdf.getPage(pageNum).then(function(page) {
                page.getTextContent().then(function(content) {
                  var lastY = null;
                  content.items.forEach(function(item) {
                    if (!item.str || !item.str.trim()) return;
                    var y = item.transform ? Math.round(item.transform[5]) : 0;
                    if (lastY !== null && Math.abs(y - lastY) > 3) fullText += '\n';
                    else if (lastY !== null) fullText += ' ';
                    fullText += item.str;
                    lastY = y;
                  });
                  fullText += '\n';
                  page.cleanup();
                  processPage(pageNum + 1);
                }).catch(function(e) { clearTimeout(timer); pdf.destroy(); resolve({ error: 'Page ' + pageNum + ' text error: ' + e.message, text: fullText }); });
              }).catch(function(e) { clearTimeout(timer); pdf.destroy(); resolve({ error: 'Page ' + pageNum + ' error: ' + e.message, text: fullText }); });
            }
            processPage(1);
          }).catch(function(e) { clearTimeout(timer); resolve({ error: 'PDF parse error: ' + e.message, text: '' }); });
        }).catch(function(e) { clearTimeout(timer); resolve({ error: 'File read error: ' + e.message, text: '' }); });
      });
    }

    // ── Process multiple PDFs with progress, error handling, and UI updates ──
    async function onPurchaseBillFiles(input) {
      var files = Array.from(input.files || []);
      if (!files.length) return;
      var statusEl = document.getElementById('pb-status');
      var tableWrap = document.getElementById('pb-table-wrap');
      var tbody = document.getElementById('pb-tbody');
      var saveBtn = document.getElementById('pb-save-btn');
      saveBtn.disabled = true;
      pbExtractedBills = [];
      tbody.innerHTML = '';
      tableWrap.style.display = 'none';

      var suppOptions = (state.data.suppliers || []).map(function(x) {
        return '<option value="' + x.SupplierId + '">' + escapeHtml(x.Name) + '</option>';
      }).join('');

      statusEl.innerHTML = '⏳ Processing ' + files.length + ' PDF(s)... Please wait.';
      var processed = 0, errors = 0;

      for (var fi = 0; fi < files.length; fi++) {
        var file = files[fi];
        statusEl.innerHTML = '⏳ Extracting <b>' + (fi + 1) + ' / ' + files.length + '</b> — ' + escapeHtml(file.name.substring(0, 30)) + '...';

        // Allow UI to update between PDFs
        await new Promise(function(r) { setTimeout(r, 50); });

        if (!file.name.toLowerCase().endsWith('.pdf')) {
          errors++;
          pbExtractedBills.push({ fileName: file.name, error: 'Not a PDF file', data: null });
          continue;
        }
        if (file.size > 10 * 1024 * 1024) {
          errors++;
          pbExtractedBills.push({ fileName: file.name, error: 'File too large (>10MB)', data: null });
          continue;
        }

        try {
          var result = await extractTextFromPdf(file, 15000);
          if (result.error || !result.text.trim()) {
            errors++;
            pbExtractedBills.push({ fileName: file.name, error: result.error || 'No text found — may be scanned/image PDF', data: null });
            continue;
          }

          if (typeof parsePurchaseBillText !== 'function') {
            errors++;
            pbExtractedBills.push({ fileName: file.name, error: 'Parser not loaded — please redeploy and hard refresh (Ctrl+Shift+R)', data: null });
            continue;
          }

          var data = parsePurchaseBillText(result.text);
          var suppId = '';
          if (data.supplierName || data.supplierGstin) {
            suppId = matchSupplierByName(data.supplierName, data.supplierGstin);
          }
          var totalCalc = data.totalAmount || (Number(data.baseAmount) > 0 ? +(Number(data.baseAmount) + Number(data.baseAmount) * (Number(data.gstPercent) || 0) / 100).toFixed(2) : 0);

          pbExtractedBills.push({
            fileName: file.name, error: null,
            data: { date: data.date, billNo: data.billNo, supplierId: suppId, supplierName: data.supplierName,
              supplierGstin: data.supplierGstin, baseAmount: data.baseAmount, gstPercent: data.gstPercent,
              totalAmount: totalCalc, description: data.description, hsnSac: data.hsnSac, quantity: data.quantity }
          });
          processed++;
        } catch (e) {
          errors++;
          pbExtractedBills.push({ fileName: file.name, error: 'Unexpected error: ' + (e.message || e), data: null });
        }
      }

      // ── Render results table ──
      var tableHtml = '';
      pbExtractedBills.forEach(function(bill, idx) {
        if (bill.error) {
          tableHtml += '<tr style="background:#fff1f2;"><td style="padding:4px 6px; border:1px solid #ddd;">' + (idx + 1) + '</td>'
            + '<td colspan="11" style="padding:4px 6px; border:1px solid #ddd; color:#be123c;">❌ ' + escapeHtml(bill.fileName) + ' — ' + escapeHtml(bill.error) + '</td></tr>';
          return;
        }
        var d = bill.data;
        var suppSel = '<select id="pb-supp-' + idx + '" style="font-size:11px; width:100%; padding:2px;"><option value="">—</option>' + suppOptions + '</select>';
        tableHtml += '<tr>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; text-align:center;">' + (idx + 1) + '</td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; font-size:10px; max-width:80px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + escapeHtml(bill.fileName) + '">📄 ' + escapeHtml(bill.fileName.substring(0, 15)) + '</td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd;"><input type="date" id="pb-date-' + idx + '" value="' + (d.date || '') + '" style="font-size:11px; width:100%; padding:2px;" /></td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd;"><input type="text" id="pb-billno-' + idx + '" value="' + escapeHtml(d.billNo || '') + '" style="font-size:11px; width:100%; padding:2px;" /></td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; min-width:100px;">' + suppSel + '<div style="font-size:9px; color:#666; margin-top:2px;">' + escapeHtml(d.supplierName || '') + '</div></td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd;"><input type="text" id="pb-desc-' + idx + '" value="' + escapeHtml(d.description || '') + '" style="font-size:11px; width:100%; padding:2px;" /></td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd;"><input type="number" id="pb-base-' + idx + '" value="' + (d.baseAmount || '') + '" step="0.01" style="font-size:11px; width:70px; padding:2px;" /></td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd;"><input type="number" id="pb-gst-' + idx + '" value="' + (d.gstPercent || 18) + '" style="font-size:11px; width:40px; padding:2px;" /></td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; font-weight:700; color:#047857;">₹ ' + money(d.totalAmount || 0) + '</td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; font-size:10px;">' + escapeHtml(d.hsnSac || '') + '</td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; font-size:10px;">' + escapeHtml(d.quantity || '') + '</td>'
          + '<td style="padding:3px 5px; border:1px solid #ddd; font-size:10px; color:#047857;">✅</td>'
          + '</tr>';
      });
      tbody.innerHTML = tableHtml; // Single DOM update (not +=)

      // Set supplier dropdowns to matched values
      setTimeout(function() {
        pbExtractedBills.forEach(function(bill, idx) {
          if (!bill.data || !bill.data.supplierId) return;
          var sel = document.getElementById('pb-supp-' + idx);
          if (sel) sel.value = bill.data.supplierId;
        });
      }, 100);

      tableWrap.style.display = 'block';
      var okCount = pbExtractedBills.filter(function(b) { return !b.error; }).length;
      statusEl.innerHTML = '✅ <b>' + okCount + '</b> bill(s) extracted' + (errors > 0 ? ' · ❌ ' + errors + ' failed' : '') + ' — review and click Save All.';
      saveBtn.disabled = okCount === 0;
      saveBtn.textContent = '✔ Save All ' + okCount + ' Purchase Bill' + (okCount > 1 ? 's' : '');
    }

    // ── Save all extracted bills to server ──
    async function saveAllPurchaseBills() {
      var validBills = pbExtractedBills.filter(function(b) { return !b.error && b.data; });
      if (!validBills.length) { toast('No valid bills to save', 'error'); return; }

      showLoading(true);
      var saved = 0, failed = 0;
      var saveBtn = document.getElementById('pb-save-btn');
      if (saveBtn) saveBtn.disabled = true;

      for (var i = 0; i < validBills.length; i++) {
        var bill = validBills[i];
        var idx = pbExtractedBills.indexOf(bill);

        var date = (document.getElementById('pb-date-' + idx) || {}).value || bill.data.date;
        var billNo = (document.getElementById('pb-billno-' + idx) || {}).value || bill.data.billNo;
        var supplierId = (document.getElementById('pb-supp-' + idx) || {}).value || bill.data.supplierId || '';
        var desc = (document.getElementById('pb-desc-' + idx) || {}).value || bill.data.description;
        var base = Number((document.getElementById('pb-base-' + idx) || {}).value) || Number(bill.data.baseAmount) || 0;
        var gst = Number((document.getElementById('pb-gst-' + idx) || {}).value) || Number(bill.data.gstPercent) || 18;

        if (!date || !billNo || base <= 0) { failed++; continue; }

        try {
          await new Promise(function(resolve, reject) {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
              .addPurchaseBill({ date: date, supplierId: supplierId, billNo: billNo, baseAmount: base, gstPercent: gst, description: desc, status: 'Unpaid', itcStatus: 'Pending' });
          });
          saved++;
        } catch (err) { failed++; }
      }

      showLoading(false);
      closePurchaseBillUpload();
      toast('Purchase Bills saved ✅ — ' + saved + ' saved' + (failed > 0 ? ', ' + failed + ' failed' : ''), saved > 0 ? 'success' : 'error');
      backgroundSync(500);
    }

    // ============================================================
    // SETUP / DATA LOADING / DIAGNOSTICS / FOLDER
    // ============================================================
    function runSetup() {
      setStatus('Initializing database tables...'); showLoading(true);
      google.script.run
        .withSuccessHandler(res => { showLoading(false); setStatus(res.message || 'Setup complete.'); toast(res.message || 'Database initialized ✅', 'success'); loadData(); })
        .withFailureHandler(err => { showLoading(false); setStatus((err && err.message) || 'Setup failed.', true); toast((err && err.message) || 'Setup failed.', 'error'); })
        .setupKgsWorkbook(state.activeFirmId);
    }
    function loadData(forceRefresh) {
      var label = forceRefresh ? 'Refreshing data (force)' : 'Loading data';
      setStatus(label + ' for ' + (getFirmName() || 'firm') + '...'); showLoading(true);
      const firmId = state.activeFirmId || '';
      let settled = false;
      const timeoutId = setTimeout(() => { if (!settled) { showLoading(false); setStatus('Still waiting on server after 20s. Deploy a NEW version and retry.', true); } }, 20000);
      google.script.run
        .withSuccessHandler(res => {
          settled = true; clearTimeout(timeoutId); showLoading(false);
          state.data = Object.assign(state.data, res);
          if (res.firms) state.firms = res.firms;
          if (res.activeFirmId) state.activeFirmId = res.activeFirmId;
          computeAllocations();
          renderFirmSelector(); renderDashboard(); renderCharts(); renderTabs(); renderTabContent();
          setStatus('Data loaded ' + (res._fromCache ? '⚡ (cached)' : '✅ (fresh)') + ' — ' + getFirmName());
          saveToCache_();
          if (res.spreadsheetUrl) {
            const fp = res.attachmentsFolder ? ' &nbsp;·&nbsp; 📁 <a href="' + res.attachmentsFolder.url + '" target="_blank">' + escapeHtml(res.attachmentsFolder.name) + '</a>' : '';
            document.getElementById('sheetLink').innerHTML = '📊 Data: <a href="' + res.spreadsheetUrl + '" target="_blank">' + escapeHtml(res.spreadsheetName || 'ERP Sheet') + '</a>' + fp;
          }
        })
        .withFailureHandler(err => {
          settled = true; clearTimeout(timeoutId); showLoading(false);
          setStatus((err && err.message) || 'Failed to load data.', true);
          toast((err && err.message) || 'Failed to load data.', 'error');
        }).getInitialData(firmId, forceRefresh || false);
    }
    function getFirmName() {
      if (!state.activeFirmId || !state.firms.length) return state.data.company ? state.data.company.name : '';
      const f = state.firms.find(x => x.id === state.activeFirmId);
      return f ? f.name : '';
    }
    function switchFirm(firmId) {
      if (firmId === state.activeFirmId) return;
      state.activeFirmId = firmId;
      toast('Switching to ' + getFirmName() + '...', 'success');
      // Tell server to switch firm, then reload data
      google.script.run.withSuccessHandler(function() { loadData(); })
        .withFailureHandler(function() { loadData(); })
        .setActiveFirm(firmId);
    }
    function renderFirmSelector() {
      const el = document.getElementById('firm-selector');
      if (!el || !state.firms || state.firms.length < 2) return;
      let html = '';
      state.firms.forEach(f => {
        const sel = f.id === state.activeFirmId ? 'selected' : '';
        html += `<option value="${f.id}" ${sel}>${escapeHtml(f.name)}</option>`;
      });
      el.innerHTML = html;
      el.style.display = 'inline-block';
    }
    function loadSheetLink() {
      const firmId = state.activeFirmId || '';
      google.script.run.withSuccessHandler(info => {
        const folderPart = info.attachmentsFolder ? ` &nbsp;·&nbsp; 📁 <a href="${info.attachmentsFolder.url}" target="_blank" rel="noopener">${info.attachmentsFolder.name}</a>` : '';
        document.getElementById('sheetLink').innerHTML = `📊 Data: <a href="${info.url}" target="_blank" rel="noopener">${info.name}</a>${folderPart}`;
      }).withFailureHandler(() => {}).getBackingSpreadsheetInfo(firmId);
    }

    // ── Quick refresh: re-render from local state (NO server call) ──
    function quickRefresh() {
      computeAllocations();
      renderDashboard(); renderCharts(); renderTabContent();
      saveToCache_();
    }

    // ── Background sync: silently fetch fresh data without blocking UI ──
    var bgSyncTimer_ = null;
    function backgroundSync(delayMs) {
      if (bgSyncTimer_) clearTimeout(bgSyncTimer_);
      bgSyncTimer_ = setTimeout(function() {
        var firmId = state.activeFirmId || '';
        google.script.run
          .withSuccessHandler(function(res) {
            state.data = Object.assign(state.data, res);
            if (res.firms) state.firms = res.firms;
            computeAllocations();
            renderDashboard(); renderCharts(); renderTabContent();
            saveToCache_();
          })
          .withFailureHandler(function() {}) // silent fail
          .getInitialData(firmId, true); // force=true — always read fresh from sheet
      }, delayMs || 3000);
    }
    function runDiagnostics() {
      setStatus('Running diagnostics...'); showLoading(true);
      google.script.run
        .withSuccessHandler(info => {
          showLoading(false); setStatus('System health check complete ✅');
          const rows = info.sheets.map(s => [s.expectedName, s.exists ? badge('Yes') : badge('No'), s.rowCount,
            (s.header || []).join(', ') || '—',
            s.amountCheck ? `Raw: [${s.amountCheck.rawSampleValues.map(v => JSON.stringify(v)).join(', ')}] → Sum: ${money(s.amountCheck.parsedSum)}` : '—']);
          document.getElementById('diagnostics').innerHTML = `<div class="panel"><h3>🩺 System Health Check</h3>
            <div><b>Spreadsheet:</b> <a href="${info.spreadsheetUrl}" target="_blank" rel="noopener">${info.spreadsheetName}</a></div>
            <div style="margin:6px 0;"><b>All tabs in file:</b> ${info.allTabsInFile.join(', ')}</div>
            ${simpleTable(['Expected Tab', 'Found?', 'Data Rows', 'Header Columns', 'Amount Check (first 3 raw → parsed sum)'], rows)}</div>`;
        })
        .withFailureHandler(err => { showLoading(false); setStatus((err && err.message) || 'System health check failed.', true); toast((err && err.message) || 'System health check failed.', 'error'); })
        .getDiagnostics();
    }
    function openAttachmentsFolder() {
      const f = state.data.attachmentsFolder;
      if (f && f.url) window.open(f.url, '_blank');
      else toast('Folder link not loaded yet — press 🔄 Refresh Data first (it is created on first upload).', 'error');
    }

    // ============================================================
    // CLIENT-SIDE CACHE — instant load from cache, then refresh from server
    // ============================================================
    function cacheKey_() { return 'KGS_ERP_CACHE_' + (state.activeFirmId || 'default'); }
    function saveToCache_() {
      try {
        const slim = {};
        ['customers','suppliers','workOrders','purchaseOrders','inventory','paymentsIn','expensesOut',
         'cashBook','quotations','bills','purchaseBills','gstReturns','directorsBook','dashboard',
         'company','directors','directorsSummary','firms','activeFirmId','spreadsheetUrl','spreadsheetName','attachmentsFolder']
        .forEach(function(k) { if (state.data[k] !== undefined) slim[k] = state.data[k]; });
        slim.firms = state.firms; slim.activeFirmId = state.activeFirmId;
        slim._cachedAt = Date.now();
        localStorage.setItem(cacheKey_(), JSON.stringify(slim));
      } catch(e) {} // quota exceeded — silently fail
    }
    function loadFromCache_() {
      try {
        const raw = localStorage.getItem(cacheKey_());
        if (!raw) return false;
        const cached = JSON.parse(raw);
        // Use cache if less than 10 minutes old
        if (cached._cachedAt && (Date.now() - cached._cachedAt) < 2 * 60 * 1000) { // 2 min cache — keeps data fresh for multi-user
          state.data = Object.assign(state.data, cached);
          if (cached.firms) state.firms = cached.firms;
          if (cached.activeFirmId) state.activeFirmId = cached.activeFirmId;
          computeAllocations();
          renderFirmSelector(); renderDashboard(); renderCharts(); renderTabs(); renderTabContent();
          setStatus('Loaded from cache ⚡ — refreshing from server...');
          if (cached.spreadsheetUrl) {
            const fp = cached.attachmentsFolder ? ' · 📁 <a href="' + cached.attachmentsFolder.url + '" target="_blank">' + escapeHtml(cached.attachmentsFolder.name) + '</a>' : '';
            document.getElementById('sheetLink').innerHTML = '📊 Data: <a href="' + cached.spreadsheetUrl + '" target="_blank">' + escapeHtml(cached.spreadsheetName || 'Sheet') + '</a>' + fp;
          }
          return true;
        }
      } catch(e) {}
      return false;
    }

    // ============================================================
    // INIT
    // ============================================================
    if (!tabs.some(t => t.key === state.activeTab)) state.activeTab = 'dashboard';
    const sideVersionEl = document.getElementById('side-version');
    if (sideVersionEl) sideVersionEl.textContent = 'v' + ERP_VERSION;
    renderTabs();
    // Show cached data INSTANTLY, then refresh in background
    const hadCache = loadFromCache_();
    loadData(); // Always fetch fresh data from server too
  </script>
</html>
